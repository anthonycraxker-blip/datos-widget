                          android:id="@+id/val_today"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:maxLines="1"
                          android:text="--"
                          android:textColor="#FFFFFF"
                          android:textSize="12sp"
                          android:textStyle="bold" />
                  </LinearLayout>

                  <ProgressBar
                      android:id="@+id/bar_today"
                      style="?android:attr/progressBarStyleHorizontal"
                      android:layout_width="match_parent"
                      android:layout_height="5dp"
                      android:layout_marginTop="3dp"
                      android:max="100"
                      android:maxHeight="5dp"
                      android:minHeight="5dp"
                      android:progress="0"
                      android:progressDrawable="@drawable/bar" />
              </LinearLayout>
          </LinearLayout>
          EOF_8
          mkdir -p app/src/main/res/mipmap-anydpi-v26
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF_9'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/icon_bg" />
              <foreground android:drawable="@drawable/ic_fg" />
          </adaptive-icon>
          EOF_9
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/colors.xml <<'EOF_10'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="icon_bg">#0A1628</color>
          </resources>
          EOF_10
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/widget_info.xml <<'EOF_11'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp"
              android:minHeight="110dp"
              android:targetCellWidth="4"
              android:targetCellHeight="2"
              android:updatePeriodMillis="1800000"
              android:initialLayout="@layout/widget"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen" />
          EOF_11
          cat > build.gradle <<'EOF_12'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF_12
          cat > gradle.properties <<'EOF_13'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF_13
          cat > settings.gradle <<'EOF_14'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "DatosWidget"
          include ':app'
          EOF_14

      - name: Compilar
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publicar APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk DatosWidget.apk
          gh release create "v${{ github.run_number }}" DatosWidget.apk --title "Datos Widget v${{ github.run_number }}" --notes "APK listo para instalar en Android"
